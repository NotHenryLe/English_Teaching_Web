<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bạn đang ngoại tuyến</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf8f3; color: #18212f; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 1.5rem; }
      h1 { font-size: 1.6rem; margin: 1rem 0 0.5rem; }
      p { color: #5b6577; max-width: 26rem; margin: 0 auto 1.5rem; line-height: 1.6; }
      .logo { width: 4rem; height: 4rem; border-radius: 1.1rem; background: #2647c8; color: #fff; display: inline-grid; place-items: center; font-weight: 800; font-size: 1.6rem; }
      button { font: inherit; font-weight: 600; padding: 0.7rem 1.4rem; border-radius: 0.9rem; border: 0; background: #2647c8; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">Aa</div>
      <h1>Bạn đang ngoại tuyến</h1>
      <p>Không có kết nối mạng. Những trang bạn đã mở trước đó vẫn xem lại được; hãy kết nối mạng để học tiếp nội dung mới.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
